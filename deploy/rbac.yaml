apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: oct-baremetal
  labels:
    app.kubernetes.io/part-of: oct-baremetal
rules:
  - apiGroups:
      - metal3.io
    resources:
      - baremetalhosts
    verbs:
      - get
      - list
      - watch
      - create
      - patch
      - update
      - delete
  - apiGroups:
      - cdi.kubevirt.io
    resources:
      - datasources
      - dataimportcrons
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - get
      - list
      - create
      - update
      - patch
  - apiGroups:
      - ""
    resources:
      - namespaces
    verbs:
      - get
      - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: oct-baremetal
  labels:
    app.kubernetes.io/part-of: oct-baremetal
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: oct-baremetal
subjects:
  - kind: ServiceAccount
    name: default
    namespace: oct-baremetal
