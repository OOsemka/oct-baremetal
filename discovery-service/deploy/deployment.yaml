apiVersion: apps/v1
kind: Deployment
metadata:
  name: discovery-service
  namespace: oct-baremetal
  labels:
    app: discovery-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: discovery-service
  template:
    metadata:
      labels:
        app: discovery-service
    spec:
      containers:
        - name: discovery-service
          image: quay.io/cjanisze/oct-baremetal-discovery:4.22
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 8443
              name: https
          volumeMounts:
            - name: tls
              mountPath: /var/run/secrets/tls
              readOnly: true
            - name: image-cache
              mountPath: /data/image-cache
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: [ALL]
      volumes:
        - name: tls
          secret:
            secretName: discovery-service-tls
        - name: image-cache
          persistentVolumeClaim:
            claimName: image-cache
      serviceAccountName: discovery-service
